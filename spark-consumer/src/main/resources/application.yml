facepay:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_TOPIC:face-pay-logs}
  postgres:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/facepay_stream}
    user: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    table: ${POSTGRES_TABLE:critical_logs}
